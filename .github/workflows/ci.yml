name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      # --ignore-scripts: none of this project's dependencies need an
      # install-time lifecycle script, so skip running arbitrary code a
      # compromised transitive dependency could ship in one.
      - run: npm ci --ignore-scripts
      # --no-install: resolve `tsc` from this project's own node_modules
      # (already installed above, pinned by package-lock.json) rather than
      # letting npx fetch and run an arbitrary, unpinned `typescript`
      # release on demand.
      - run: npx --no-install tsc --noEmit
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # Full suite needs Postgres+pgvector, BM25 index, and Groq (see test file headers).
      # CI runs the offline-safe subset plus auth and API contract tests.
      # Deselected tests need the gitignored corpus/indexes (bm25.pkl, knowledge_graph.json) or live translation.
      - run: >
          python -m pytest -q
          tests/test_auth.py
          tests/test_api_contract.py
          tests/test_sources_endpoint.py
          tests/test_form_generator.py
          tests/test_compliance_flags.py
          tests/test_citation_matcher.py
          tests/test_forms.py
          tests/test_asr.py
          tests/test_formulation_and_response_contract.py
          tests/test_knowledge_graph.py
          tests/test_trap01_ip_patent_guard.py
          tests/test_translation_term_protection.py
          --deselect tests/test_sources_endpoint.py::test_real_india_source_file_is_served
          --deselect tests/test_sources_endpoint.py::test_real_international_source_file_is_served
          --deselect tests/test_forms.py::test_run_query_attaches_no_forms_on_a_real_abstention
          --deselect tests/test_knowledge_graph.py::test_knowledge_graph_file_exists
          --deselect tests/test_knowledge_graph.py::test_domestic_tk_tag_surfaces_real_international_counterpart
          --deselect tests/test_knowledge_graph.py::test_related_provisions_carry_deterministic_second_hop
          --deselect tests/test_knowledge_graph.py::test_expand_related_provisions_node_end_to_end
          --deselect tests/test_translation_term_protection.py::test_devanagari_input_resolves_to_canonical_english_term

  docker-build:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.yml config
      - run: docker compose -f docker-compose.yml build backend frontend

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      # Pinned to match .pre-commit-config.yaml's hook revisions exactly,
      # so a push can't pass here while `pre-commit run --all-files` would
      # still fail locally, or vice versa.
      - run: pip install black==24.10.0 isort==5.13.2 flake8==7.1.1
      - run: python -m black --check .
      # --src-path=backend: this job's cwd is already backend/ (same as
      # the local `isort --profile black .` run), but pre-commit's own
      # isort hook runs from the repo root and silently misclassifies this
      # project's own packages as third-party without it — see
      # .pre-commit-config.yaml's comment for how that was actually found.
      - run: python -m isort --check-only --profile black --src-path . .
      - run: python -m flake8 --select=E9,F63,F7,F82,F401,F841 .
