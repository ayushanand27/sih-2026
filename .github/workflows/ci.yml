name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      # --ignore-scripts: none of this project's dependencies need an
      # install-time lifecycle script, so skip running arbitrary code a
      # compromised transitive dependency could ship in one.
      - run: npm ci --ignore-scripts
      # --no-install: resolve `tsc` from this project's own node_modules
      # (already installed above, pinned by package-lock.json) rather than
      # letting npx fetch and run an arbitrary, unpinned `typescript`
      # release on demand.
      - run: npx --no-install tsc --noEmit
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # The real suite needs a live Postgres+pgvector DB and real Groq calls
      # (see backend/tests/ — deliberately not mocked). Running that here
      # would need DATABASE_URL/GROQ_API_KEY as repo secrets and would spend
      # real LLM quota on every push, so CI only verifies the test files
      # themselves import and collect cleanly, catching syntax/import
      # errors without touching any external service.
      - run: python -m pytest --collect-only -q

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      # Pinned to match .pre-commit-config.yaml's hook revisions exactly,
      # so a push can't pass here while `pre-commit run --all-files` would
      # still fail locally, or vice versa.
      - run: pip install black==24.10.0 isort==5.13.2 flake8==7.1.1
      - run: python -m black --check .
      # --src-path=backend: this job's cwd is already backend/ (same as
      # the local `isort --profile black .` run), but pre-commit's own
      # isort hook runs from the repo root and silently misclassifies this
      # project's own packages as third-party without it — see
      # .pre-commit-config.yaml's comment for how that was actually found.
      - run: python -m isort --check-only --profile black --src-path . .
      - run: python -m flake8 --select=E9,F63,F7,F82,F401,F841 .
