sonar.projectKey=ipsakti-sih-2026
sonar.projectName=IP-SAKTI Sahayak
sonar.projectVersion=0.2.0

# Run SonarScanner from repo root (iam/sih-2026):
#   sonar-scanner -Dsonar.host.url=https://your-sonarqube -Dsonar.token=$SONAR_TOKEN
#
# Token is optional for local template use; CI can skip analysis until a host is configured.

sonar.sources=backend,frontend/src
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=**/*test*,**/*.test.tsx,**/*.test.ts
sonar.exclusions=**/node_modules/**,**/.next/**,**/data/**,**/*.pdf

sonar.python.version=3.12
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

sonar.sourceEncoding=UTF-8
